# Keeps the free Supabase project awake and keeps this schedule itself switched on.
# - Supabase pauses a free project after 7 days without requests; one small read every few days prevents that.
#   If the read fails (project already paused, key changed), the run fails and GitHub emails the repo owner.
# - GitHub turns off scheduled workflows in a public repo after 60 days without activity;
#   calling the "enable workflow" API on every run keeps this one on.
name: keep-alive

on:
  schedule:
    - cron: '17 3 */3 * *'   # 03:17 UTC on day 1, 4, 7, ... of each month: never more than 3 days apart
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from Supabase
        env:
          SUPABASE_URL: https://czyefarlcanffczymewb.supabase.co
          # the public anon key that app.js already ships to every browser (never the service_role key)
          SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6eWVmYXJsY2FuZmZjenltZXdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3NjAzMTcsImV4cCI6MjExMDMzNjMxN30.1BDNW0KWKxejxbXT5iazqYDW8aNPSwsrSHL83UyUbJo
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/docs?select=path&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase answered HTTP $code"
          test "$code" = 200

      - name: Keep this schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
