.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}

   ถ้ายังไม่ใส่ค่า เว็บจะเก็บข้อมูลในเบราว์เซอร์ของเครื่องนั้นเท่านั้น (โหมดทดลอง) */
const SUPABASE_URL='PUT_SUPABASE_URL_HERE';   // เช่น https://abcdefgh.supabase.co
const SUPABASE_KEY='PUT_SUPABASE_KEY_HERE';   // anon / publishable key
const BUCKET='hms';

let sb=null;
const LOCALURL=new Map();
const BLOB=id=>!id?'':(LOCALURL.get(id)||(sb?`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(id)}`:''));
/* โหมดทดลอง: เก็บข้อมูลและไฟล์ใน IndexedDB ของเบราว์เซอร์ */
function idbOpen(){return new Promise((ok,no)=>{const r=indexedDB.open('hms',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs',{keyPath:'path'}).createIndex('parent','parent');d.createObjectStore('files',{keyPath:'id'})};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function idbTx(d,store,mode,fn){return new Promise((ok,no)=>{const t=d.transaction(store,mode),q=fn(t.objectStore(store));let out;
  if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>ok(out);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})}
async function makeLocal(){
  const d=await idbOpen();
  (await idbTx(d,'files','readonly',s=>s.getAll())).forEach(f=>LOCALURL.set(f.id,URL.createObjectURL(f.blob)));
  const subs=new Map(),kick=p=>{const s=subs.get(p);if(s)s.forEach(f=>f())};
  return{
    db:{doc(path){return{
        async set(data){await idbTx(d,'docs','readwrite',s=>s.put({path,parent:parentOf(path),data}));kick(parentOf(path))},
        async delete(){await idbTx(d,'docs','readwrite',s=>s.delete(path));kick(parentOf(path))}}},
      collection(parent){return{onSnapshot(cb,onErr){let alive=true;
        const run=async()=>{if(!alive)return;try{const rows=await idbTx(d,'docs','readonly',s=>s.index('parent').getAll(parent));if(alive)cb({docs:rows.map(r=>({id:r.path.split('/').pop(),data:()=>r.data}))})}catch(e){if(alive&&onErr)onErr(e)}};
        if(!subs.has(parent))subs.set(parent,new Set());subs.get(parent).add(run);run();
        return()=>{alive=false;const s=subs.get(parent);if(s)s.delete(run)}}}}},
    assets:{
      async upload(blob){const id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);await idbTx(d,'files','readwrite',s=>s.put({id,blob}));LOCALURL.set(id,URL.createObjectURL(blob));return{id}},
      async delete(id){await idbTx(d,'files','readwrite',s=>s.delete(id));const u=LOCALURL.get(id);if(u){URL.revokeObjectURL(u);LOCALURL.delete(id)}}}
  }}
const parentOf=p=>p.split('/').slice(0,-1).join('/');
function makeDb(){
  const subs=new Map();let ch=null;
  const kick=parent=>{const s=subs.get(parent);if(s)s.forEach(f=>f())};
  function listen(){
    if(ch)return;
    ch=sb.channel('hms-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{
      const p=(pl.new&&pl.new.path)||(pl.old&&pl.old.path);if(p)kick(parentOf(p))}).subscribe();
  }
  async function fetchCol(parent){
    const{data,error}=await sb.from('docs').select('path,data').eq('parent',parent).limit(5000);if(error)throw error;
    return data.map(r=>({id:r.path.split('/').pop(),data:()=>r.data}))}
  return{
    doc(path){return{
      async set(data){const{error}=await sb.from('docs').upsert({path,parent:parentOf(path),data});if(error)throw error;kick(parentOf(path))},
      async delete(){const{error}=await sb.from('docs').delete().eq('path',path);if(error)throw error;kick(parentOf(path))}}},
    collection(parent){return{onSnapshot(cb,onErr){
      let alive=true,busy=false,again=false,last=null,failed=false;
      const run=async()=>{
        if(!alive)return;if(busy){again=true;return}busy=true;
        try{const docs=await fetchCol(parent),sg=JSON.stringify(docs.map(d=>[d.id,d.data()]));failed=false;if(alive&&sg!==last){last=sg;cb({docs})}}
        catch(e){if(alive&&onErr&&!failed)onErr(e);failed=true}
        busy=false;if(again){again=false;run()}};
      if(!subs.has(parent))subs.set(parent,new Set());subs.get(parent).add(run);listen();run();
      const iv=setInterval(run,15000),vis=()=>{if(!document.hidden)run()};document.addEventListener('visibilitychange',vis);
      return()=>{alive=false;clearInterval(iv);document.removeEventListener('visibilitychange',vis);const s=subs.get(parent);if(s){s.delete(run);if(!s.size)subs.delete(parent)}}}}}
  }
}
const assetsApi={

    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,10)+'.'+ext;
    const{error}=await sb.storage.from(BUCKET).upload(id,blob,{contentType:t,cacheControl:'31536000',upsert:false});if(error)throw error;return{id}},
  async delete(id){const{error}=await sb.storage.from(BUCKET).remove([id]);if(error)throw error}
};

async function shrink(f){if(!f.type.startsWith('image/')&&!/\.(hei[cf])$/i.test(f.name))return f;
  try{let b;try{b=await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){b=await createImageBitmap(f)}
    const k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);
    const r=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));if(!r)throw 0;return r}
  catch(e){if(/hei[cf]/i.test(f.type+f.name))throw new Error('อ่านรูป HEIC ไม่ได้ กรุณาเปลี่ยนเป็น JPG ก่อน');return f}}

  m.innerHTML=`<div class="box"><h3>${S.tab==='photos'?'Edit photo name (แก้ไขชื่อรูป)':'Edit file name (แก้ไขชื่อไฟล์)'}</h3><label>${S.tab==='photos'?'Photo name (ชื่อรูป)':'Drawing name (ชื่อแบบ)'}</label><input id="rn" maxlength="80" value="${esc(x.item||'')}"><div class="row"><button class="btn ghost" data-a="mclose">← Back (กลับ)</button><button class="btn" data-a="renok" data-id="${esc(x.id)}">Save (บันทึก)</button></div></div>`;$('#rn').focus()}
async function renSave(x,b){const n=$('#rn').value.trim();if(!n)return toast('กรุณาใส่ชื่อ');b.disabled=true;
  try{const cur=S[S.tab].find(y=>y.id===x.id);if(!cur)throw 0;const{id,...data}=cur;await db.doc(`projects/${S.proj.id}/${S.tab}/${id}`).set({...data,item:n});$('#modal').hidden=true;toast('Saved (บันทึกเรียบร้อย)')}
  catch(e){toast('บันทึกไม่สำเร็จ');b.disabled=false}}
function addPhForm(x){const m=$('#modal');m.hidden=false;
  clearMp();
  m.innerHTML=`<div class="box"><h3>Add photos (เพิ่มรูป)</h3><p class="mu sm">${esc(x.item||'(ไม่ระบุชื่อ)')} · now ${imgIds(x).length} photo(s) (ตอนนี้มี ${imgIds(x).length} รูป)</p><input id="ff2" type="file" accept="image/*" multiple><div id="pv2" class="pv"></div><div class="row"><button class="btn ghost" data-a="mclose">← Back (กลับ)</button><button class="btn" id="apok" data-a="apok" data-id="${esc(x.id)}">Save (บันทึก)</button></div></div>`}
async function addPhSave(x,b){
  const files=mp.map(p=>p.f);if(!files.length)return toast('กรุณาเลือกรูปก่อน');
  if(!assets)return toast('บัญชีนี้ยังอัปโหลดไฟล์ไม่ได้');
  b.disabled=true;const ids=[];
  try{
    for(let i=0;i<files.length;i++){b.textContent=`Uploading ${i+1}/${files.length}…`;ids.push((await assets.upload(await shrink(files[i]))).id)}
    const cur=S.photos.find(y=>y.id===x.id);if(!cur)throw new Error('รายการนี้ถูกลบไปแล้ว');
    const{id,...data}=cur,all=imgIds(cur).concat(ids);
    await db.doc(`projects/${S.proj.id}/photos/${id}`).set({...data,asset:all[0],assets:all});
    clearMp();$('#modal').hidden=true;toast('Saved (บันทึกเรียบร้อย)')
  }catch(e){await dropAssets(ids);toast('เกิดข้อผิดพลาด: '+(e.message||e.code||'ไม่ทราบสาเหตุ'));b.disabled=false;b.textContent='Save (บันทึก)'}
}
async function dropAssets(ids){if(!assets)return;for(const a of ids){try{await assets.delete(a)}catch(e){}}}
function delGate(){
  const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="box"><h3>Delete project (ลบโครงการ)</h3><p class="mu">การลบจะลบรูปและแบบทั้งหมดของโครงการนี้ และกู้คืนไม่ได้ ใส่รหัส 4 หลักเพื่อยืนยัน</p><input id="dc" type="tel" inputmode="numeric" maxlength="4" placeholder="0000"><p class="err" id="de"></p><div class="row"><button class="btn ghost" data-a="mclose">← Back (กลับ)</button><button class="btn danger-fill" data-a="delok">Delete (ลบ)</button></div></div>`;
  $('#dc').focus();
}
async function delProject(){
  if($('#dc').value.trim()!==S.proj.code){$('#de').textContent='รหัสไม่ถูกต้อง';return}
  if(!S.ready||!S.ready.photos||!S.ready.plans||!S.ready.chat){$('#de').textContent='กำลังโหลดข้อมูล กรุณารอสักครู่แล้วลองใหม่';return}
  const b=$('[data-a=delok]'),id=S.proj.id;b.disabled=true;b.textContent='กำลังลบ…';
  try{
    for(const k of ['photos','plans','chat'])for(const x of S[k]){
      await db.doc(`projects/${id}/${k}/${x.id}`).delete();
      if(assets)for(const a of imgIds(x)){if(a){try{await assets.delete(a)}catch(e){}}}
    }
    if(assets&&S.proj.cover){try{await assets.delete(S.proj.cover)}catch(e){}}
    await db.doc('projects/'+id).delete();
    home();$('#modal').hidden=true;toast('ลบโครงการแล้ว');
  }catch(x){toast('ลบไม่สำเร็จ ลองอีกครั้ง (ข้อมูลที่ลบไปแล้วบางส่วนจะไม่กลับมา)');b.disabled=false;b.textContent='Delete (ลบ)'}
}
async function save(){
  const files=picked.map(p=>p.f);if(!files.length)return toast('กรุณาเลือกไฟล์ก่อน');
  if(!assets)return toast('บัญชีนี้ยังอัปโหลดไฟล์ไม่ได้');
  const b=$('#sv'),ph=S.tab==='photos';b.disabled=true;b.textContent='Uploading… (กำลังอัปโหลด)';
  const up=[];
  try{
    const t=ph?new Date($('#fd').value).getTime()||Date.now():Date.now();
    if(ph){
      const ids=up;
      for(let i=0;i<files.length;i++){b.textContent=`Uploading ${i+1}/${files.length}… (กำลังอัปโหลด)`;ids.push((await assets.upload(await shrink(files[i]))).id)}
      const id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await db.doc(`projects/${S.proj.id}/photos/${id}`).set({cat:+$('#fc').value,item:$('#fi').value.trim(),note:$('#fn').value.trim(),asset:ids[0],assets:ids,kind:'img',fname:files[0].name,at:t});
    }else for(const f of files){
      const isPdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name),blob=isPdf?new Blob([f],{type:'application/pdf'}):f,r=await assets.upload(blob),id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      up.push(r.id);await db.doc(`projects/${S.proj.id}/${S.tab}/${id}`).set({cat:ph?+$('#fc').value:null,item:$('#fi').value.trim(),note:ph?$('#fn').value.trim():'',asset:r.id,kind:isPdf?'pdf':'img',fname:f.name,at:t});
    }
    drawForm();toast('Saved (บันทึกเรียบร้อย)');
  }catch(e){await dropAssets(up);toast('เกิดข้อผิดพลาด: '+(e.message||e.code||'ไม่ทราบสาเหตุ'));b.disabled=false;b.textContent='Save (บันทึก)'}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.in b,.in p,.in time,.pi b,.pi .sm,.proj b,.proj .sm');
  if(!t||e.target.closest('[data-a]'))return;
  if(t.scrollWidth<=t.clientWidth+1)return;
  if(!$('#modal').hidden)return;
  const m=$('#modal');m.hidden=false;m.innerHTML='<div class="box"><div class="rdb"></div><div class="row"><button class="btn ghost" data-a="mclose">← Back (กลับ)</button></div></div>';m.querySelector('.rdb').textContent=t.textContent;e.stopPropagation();e.preventDefault()
},true);
document.addEventListener('click',async e=>{
  if(!e.target.closest('.combo')){const c=$('#cl');if(c)c.hidden=true}
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;
  if(a==='cbtn'){const c=$('#cl');if(c&&!c.hidden)c.hidden=true;else showList(true)}
  else if(a==='copt'){$('#fi').value=d.v;$('#cl').hidden=true}
  else if(a==='newp')newForm();
  else if(a==='pvrm2'){const p=mp.splice(+d.i,1)[0];if(p)URL.revokeObjectURL(p.u);drawPv2()}
  else if(a==='pvrm'){const p=picked.splice(+d.i,1)[0];if(p)URL.revokeObjectURL(p.u);drawPv()}
  else if(a==='formback'){const dt=el.closest('details');if(dt)dt.open=false}
  else if(a==='addph'){const x=S.photos.find(y=>y.id===d.id);if(x)addPhForm(x)}
  else if(a==='apok'){const x=S.photos.find(y=>y.id===d.id);if(x)addPhSave(x,el)}
  else if(a==='renm'){const x=S[S.tab].find(y=>y.id===d.id);if(x)renForm(x)}
  else if(a==='dlimg'){const x=S[S.tab].find(y=>y.id===d.id);if(x){const t=el.closest('.ph').querySelector('.gtrack'),k=t?Math.round(t.scrollLeft/t.clientWidth):0;dlImg(x,imgIds(x)[k],k)}}
  else if(a==='dlall'){const x=S[S.tab].find(y=>y.id===d.id);if(x)dlAll(x,el)}
  else if(a==='gprev'||a==='gnext'){const t=el.parentElement.querySelector('.gtrack');t.scrollBy({left:(a==='gnext'?1:-1)*t.clientWidth,behavior:'smooth'})}
  else if(a==='renok'){const x=S[S.tab].find(y=>y.id===d.id);if(x)renSave(x,el)}
  else if(a==='dlpdf'){const x=S.plans.find(y=>y.id===d.id);if(x)dlPdf(x)}
  else if(a==='viewpdf'){const x=S.plans.find(y=>y.id===d.id);if(x)pdfView(x)}
  else if(a==='editp')editForm();
  else if(a==='editok')saveEdit(el);
  else if(a==='covrm'){pend=null;drawCov(null);const f=$('#pcov');if(f)f.value=''}
  else if(a==='create'){
    const n=$('#pn').value.trim(),c=$('#pc').value.trim();
    if(!n)return toast('กรุณาตั้งชื่อโครงการ');if(!/^\d{4}$/.test(c))return toast('รหัสต้องเป็นตัวเลข 4 หลัก');
    const id='p'+Date.now().toString(36),p={name:n,code:c,owner:$('#po').value.trim(),contractor:$('#pt').value.trim(),location:$('#pl').value.trim(),createdAt:Date.now()};
    el.disabled=true;
    try{if(pend){p.cover=(await assets.upload(pend)).id}await db.doc('projects/'+id).set(p);enter({id,...p})}catch(x){if(p.cover)await dropAssets([p.cover]);toast('สร้างโครงการไม่สำเร็จ');el.disabled=false}
  }else if(a==='open')gate(d.id);
  else if(a==='mclose'){clearMp();pdfView.tok=(pdfView.tok||0)+1;$('#modal').hidden=true}
  else if(a==='gok'){const p=S.projects.find(x=>x.id===d.id);if(p&&$('#gc').value.trim()===p.code)enter(p);else $('#ge').textContent='รหัสไม่ถูกต้อง'}
  else if(a==='back')home();
  else if(a==='delp')delGate();
  else if(a==='delok')delProject();
  else if(a==='chat'){S.tab='chat';$('#tabs').style.display='none';drawCats();drawForm();drawList();chatSeen();$('#form').scrollIntoView({block:'start'})}
  else if(a==='chatback'){S.tab='photos';chatSeen();$('#tabs').style.display='';drawTabs();drawCats();drawForm();drawList();window.scrollTo(0,0)}
  else if(a==='role'){const n=($('#cn')?$('#cn').value:'').trim();S.role={r:d.r,n};LS.set('hms_role_'+S.proj.id,JSON.stringify(S.role));drawChat()}
  else if(a==='crole'){S.role=null;LS.del('hms_role_'+S.proj.id);drawChat()}
  else if(a==='csend')chatSend(el)
  else if(a==='cdel'){if(el.dataset.arm){try{await db.doc(`projects/${S.proj.id}/chat/${d.id}`).delete()}catch(x){toast('ลบไม่สำเร็จ')}}else{el.dataset.arm='1';el.textContent='Delete? (ลบ?)';setTimeout(()=>{if(el.isConnected){delete el.dataset.arm;el.textContent='✕'}},3000)}}
  else if(a==='tab'){S.tab=d.t;drawTabs();drawCats();drawForm();drawList()}
  else if(a==='cat'){S.cat=+d.i;drawCats();drawList();if(S.cat>=0&&$('#fc')){$('#fc').value=S.cat;hints()}}
  else if(a==='zoom'){$('#lb img').src=d.src;$('#lb').hidden=false}
  else if(a==='lbx')$('#lb').hidden=true;
  else if(a==='save')save();
  else if(a==='del'){
    if(!el.dataset.s){el.dataset.s=1;el.textContent='Tap again (แตะอีกครั้งเพื่อลบ)';setTimeout(()=>{el.dataset.s='';el.textContent='Delete (ลบ)'},3000);return}
    try{const x0=S[S.tab].find(y=>y.id===d.id);await db.doc(`projects/${S.proj.id}/${S.tab}/${d.id}`).delete();if(x0&&assets)for(const aid of imgIds(x0)){try{await assets.delete(aid)}catch(e){}}}catch(x){toast('ลบไม่สำเร็จ')}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='fi')showList()});
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('gtrack')){const c=t.parentElement.querySelector('.gcnt');if(c)c.textContent=(Math.round(t.scrollLeft/t.clientWidth)+1)+'/'+t.children.length}},true);
document.addEventListener('change',async e=>{if(e.target.id==='ff2'){for(const f of e.target.files)mp.push({f,u:URL.createObjectURL(f)});e.target.value='';drawPv2()}
  if(e.target.id==='ff'){for(const f of e.target.files)picked.push({f,u:URL.createObjectURL(f)});e.target.value='';drawPv()}
  if(e.target.id==='pcov'){const f=e.target.files[0];if(f){pend=f;drawCov(URL.createObjectURL(pend))}}
  if(e.target.id==='fc')hints()});
(async()=>{
  const cfgOk=/^https:\/\/[^/]+$/.test(SUPABASE_URL)&&SUPABASE_KEY&&!/PUT_/.test(SUPABASE_URL+SUPABASE_KEY);
  if(cfgOk){
    try{if(!window.supabase)await loadJs('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js');
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});db=makeDb();assets=assetsApi}
    catch(e){$('#app').innerHTML='<section class="wrap"><div class="card"><h3>เชื่อมต่อฐานข้อมูลไม่สำเร็จ (Not connected)</h3><p class="mu">ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า</p></div></section>';return}
  }else{
    try{const L=await makeLocal();db=L.db;assets=L.assets}
    catch(e){$('#app').innerHTML='<section class="wrap"><div class="card"><h3>เบราว์เซอร์นี้บันทึกข้อมูลไม่ได้</h3><p class="mu">ลองปิดโหมดไม่ระบุตัวตน (Private/Incognito) แล้วเปิดใหม่</p></div></section>';return}
    document.querySelector('header').insertAdjacentHTML('afterend','<div style="background:#3a2c0e;color:#f3d79a;text-align:center;padding:6px 12px;font-size:.85rem">Demo mode: data is saved on this device only (โหมดทดลอง ข้อมูลเก็บในเครื่องนี้เท่านั้น ไม่แชร์กับเครื่องอื่น)</div>');
  }
  home();
  db.collection('projects').onSnapshot(q=>{S.projects=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));if(!S.proj)drawProjects();else if(!S.projects.some(x=>x.id===S.proj.id)&&Date.now()-(S.proj.createdAt||0)>60000){toast('โครงการนี้ถูกลบแล้ว');home()}},()=>toast('โหลดโครงการไม่สำเร็จ'));
})();
</script></body></html>
